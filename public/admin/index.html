<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="dark" />
    <link rel="cms-config-url" type="text/yaml" href="/admin/config.yml" />
    <link rel="icon" href="/images/kwslinkhout-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" />
    <title>Beheer | KWS Linkhout</title>
    <style>
      /*
       * De inlogpagina van het beheer, in dezelfde taal als de site: de donkere
       * inktkleur, het rood van de club, Archivo voor de koppen. Wie inlogt,
       * ziet daarna Sveltia CMS, dat zelf een donker thema heeft.
       */
      :root {
        --inkt-950: #0a0607;
        --inkt-900: #120c0d;
        --inkt-800: #1c1416;
        --rood: #dc2626;
        --rood-licht: #ef4444;
        --zand: #faf8f6;
        --tekst: #f5f0ee;
        --tekst-zacht: rgba(245, 240, 238, 0.62);
        --lijn: rgba(255, 255, 255, 0.1);
      }
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }
      body {
        font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
        color: var(--tekst);
        background: var(--inkt-950);
        -webkit-font-smoothing: antialiased;
      }
      #kws-overlay {
        position: fixed; inset: 0; z-index: 999999;
        display: grid; grid-template-columns: 1fr;
        min-height: 100vh;
        background:
          radial-gradient(60% 50% at 20% 100%, rgba(220, 38, 38, 0.22), transparent 70%),
          radial-gradient(40% 40% at 90% 0%, rgba(220, 38, 38, 0.12), transparent 70%),
          var(--inkt-950);
      }
      @media (min-width: 900px) { #kws-overlay { grid-template-columns: 1.15fr 1fr; } }

      /* Linkerhelft: het schild met gloed en een zin, zoals de startpagina. */
      #kws-links {
        display: none; position: relative; overflow: hidden;
        align-items: center; justify-content: center;
        padding: 64px;
        border-right: 1px solid var(--lijn);
      }
      @media (min-width: 900px) { #kws-links { display: flex; } }
      #kws-links::before {
        content: ""; position: absolute; inset: 0;
        background-image: url("/images/teams/1ste-ploeg-2025.jpg");
        background-size: cover; background-position: center;
        opacity: 0.16; filter: saturate(0.6);
      }
      #kws-links::after {
        content: ""; position: absolute; inset: 0;
        background: linear-gradient(180deg, rgba(10, 6, 7, 0.2), rgba(10, 6, 7, 0.9));
      }
      .kws-intro { position: relative; z-index: 1; max-width: 460px; }
      .kws-intro img { width: 220px; height: auto; display: block; margin-bottom: 28px; }
      .kws-opschrift {
        display: inline-flex; align-items: center; gap: 10px;
        font-size: 0.6875rem; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase;
        color: var(--tekst-zacht); margin-bottom: 18px;
      }
      .kws-opschrift::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--rood-licht); }
      .kws-intro h2 {
        font-family: Archivo, Inter, sans-serif; font-weight: 800; font-size: clamp(2rem, 3.4vw, 3rem);
        line-height: 1.02; letter-spacing: -0.03em; text-wrap: balance;
      }
      .kws-intro h2 span { color: var(--rood-licht); }
      .kws-intro p { margin-top: 18px; color: var(--tekst-zacht); font-size: 1rem; line-height: 1.6; max-width: 38ch; }

      /* Rechterhelft: de kaart. */
      #kws-rechts { display: flex; align-items: center; justify-content: center; padding: 40px 24px; }
      .kws-kaart {
        width: 100%; max-width: 420px;
        background: var(--inkt-900); border: 1px solid var(--lijn); border-radius: 20px;
        padding: 36px 32px; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
      }
      .kws-kaart-logo { display: flex; justify-content: center; margin-bottom: 18px; }
      .kws-kaart-logo img { width: 120px; height: auto; }
      @media (min-width: 900px) { .kws-kaart-logo { display: none; } }
      .kws-kaart h1 {
        font-family: Archivo, Inter, sans-serif; font-weight: 800; font-size: 1.6rem;
        letter-spacing: -0.02em; text-align: center; margin-bottom: 6px;
      }
      .kws-kaart .subtitle { font-size: 0.9rem; color: var(--tekst-zacht); text-align: center; margin-bottom: 26px; }
      .kws-tabs { display: flex; background: var(--inkt-800); border-radius: 12px; padding: 4px; margin-bottom: 22px; }
      .kws-tab {
        flex: 1; border: 0; background: transparent; color: var(--tekst-zacht);
        font: inherit; font-weight: 600; font-size: 0.875rem; padding: 10px; border-radius: 9px; cursor: pointer;
        transition: background 0.2s, color 0.2s;
      }
      .kws-tab.active { background: var(--rood); color: #fff; }
      .kws-panel { display: none; }
      .kws-panel.active { display: block; }
      .kws-veld { margin-bottom: 14px; }
      .kws-veld label {
        display: block; font-size: 0.6875rem; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase;
        color: var(--tekst-zacht); margin-bottom: 7px;
      }
      .kws-veld input, .kws-veld textarea {
        width: 100%; font: inherit; font-size: 0.95rem; color: var(--tekst);
        background: var(--inkt-950); border: 1px solid var(--lijn); border-radius: 10px;
        padding: 12px 14px; outline: none; transition: border-color 0.2s, box-shadow 0.2s;
      }
      .kws-veld textarea { min-height: 96px; resize: vertical; }
      .kws-veld input:focus, .kws-veld textarea:focus { border-color: var(--rood-licht); box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.25); }
      .kws-knop {
        width: 100%; margin-top: 6px; border: 0; border-radius: 999px; cursor: pointer;
        background: var(--rood); color: #fff; font: inherit; font-weight: 600; font-size: 0.95rem;
        padding: 13px 18px; transition: background 0.2s, transform 0.2s;
      }
      .kws-knop:hover { background: var(--rood-licht); transform: translateY(-1px); }
      .kws-knop:disabled { opacity: 0.6; cursor: wait; transform: none; }
      .kws-msg-error { color: #fca5a5; font-size: 0.85rem; min-height: 1.2em; margin-top: 10px; }
      .kws-msg-ok { color: #86efac; font-size: 0.85rem; margin-top: 10px; }
      .kws-voet { margin-top: 22px; text-align: center; font-size: 0.75rem; color: var(--tekst-zacht); }
      .kws-voet a { color: inherit; }
      @media (prefers-reduced-motion: reduce) { .kws-knop, .kws-tab { transition: none; } }
    </style>
  </head>
  <body>
    <div id="kws-overlay">
      <div id="kws-links">
        <div class="kws-intro">
          <img src="/images/logo-kws-gloed-transparant.png" alt="" />
          <div class="kws-opschrift">Beheer van de site</div>
          <h2>Nieuws, foto&apos;s en <span>evenementen</span> van de club.</h2>
          <p>Wat je hier bewaart, staat een minuut later op kwslinkhout.be. Geen code, geen wachttijd.</p>
        </div>
      </div>

      <div id="kws-rechts">
        <div class="kws-kaart">
          <div class="kws-kaart-logo"><img src="/images/logo-kws-gloed-transparant.png" alt="KWS Linkhout" /></div>
          <h1>Aanmelden</h1>
          <p class="subtitle">Beheer van kwslinkhout.be</p>

          <div class="kws-tabs">
            <button type="button" class="kws-tab active" onclick="kwsTab('login')">Inloggen</button>
            <button type="button" class="kws-tab" onclick="kwsTab('aanvraag')">Toegang vragen</button>
          </div>

          <div id="panel-login" class="kws-panel active">
            <div class="kws-veld">
              <label for="kws-email">E-mailadres</label>
              <input id="kws-email" type="email" autocomplete="username" placeholder="naam@voorbeeld.be" />
            </div>
            <div class="kws-veld">
              <label for="kws-password">Wachtwoord</label>
              <input id="kws-password" type="password" autocomplete="current-password" placeholder="Je wachtwoord" />
            </div>
            <button type="button" class="kws-knop" id="kws-login-btn" onclick="kwsLogin()">Inloggen</button>
            <div class="kws-msg-error" id="kws-login-error"></div>
          </div>

          <div id="panel-aanvraag" class="kws-panel">
            <div class="kws-veld">
              <label for="req-naam">Naam</label>
              <input id="req-naam" type="text" placeholder="Voor- en achternaam" />
            </div>
            <div class="kws-veld">
              <label for="req-email">E-mailadres</label>
              <input id="req-email" type="email" placeholder="naam@voorbeeld.be" />
            </div>
            <div class="kws-veld">
              <label for="req-bericht">Waarvoor heb je toegang nodig?</label>
              <textarea id="req-bericht" placeholder="Bv. berichten en foto&apos;s van de U11 plaatsen"></textarea>
            </div>
            <button type="button" class="kws-knop" id="req-btn" onclick="kwsAanvraag()">Aanvraag versturen</button>
            <div class="kws-msg-error" id="req-error"></div>
            <div id="req-ok" style="display:none" class="kws-msg-ok">
              Je aanvraag is verstuurd. De beheerder neemt contact met je op.
            </div>
          </div>

          <p class="kws-voet"><a href="/">Terug naar de site</a></p>
        </div>
      </div>
    </div>

    <script>
      // Al ingelogd (token bewaard)? Dan meteen het CMS laden, zonder de kaart.
      (function () {
        try {
          var bewaard = localStorage.getItem("sveltia-cms.user") || localStorage.getItem("decap-cms-user");
          if (bewaard && JSON.parse(bewaard).token) kwsLaadCms();
        } catch (e) { /* geen opslag: toon de kaart */ }
      })();

      function kwsTab(tab) {
        document.querySelectorAll(".kws-tab").forEach(function (t, i) {
          t.classList.toggle("active", (i === 0 && tab === "login") || (i === 1 && tab === "aanvraag"));
        });
        document.getElementById("panel-login").classList.toggle("active", tab === "login");
        document.getElementById("panel-aanvraag").classList.toggle("active", tab === "aanvraag");
        document.getElementById(tab === "login" ? "kws-email" : "req-naam").focus();
      }

      document.addEventListener("keydown", function (e) {
        if (e.key !== "Enter") return;
        if (document.getElementById("panel-login").classList.contains("active")) kwsLogin();
      });

      function kwsLogin() {
        var email = document.getElementById("kws-email").value.trim();
        var pw = document.getElementById("kws-password").value;
        var knop = document.getElementById("kws-login-btn");
        var fout = document.getElementById("kws-login-error");
        if (!email || !pw) { fout.textContent = "Vul e-mailadres en wachtwoord in."; return; }
        knop.disabled = true; knop.textContent = "Bezig..."; fout.textContent = "";
        fetch("/api/admin-login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: email, password: pw }),
        })
          .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
          .then(function (res) {
            if (!res.ok || !res.d.token) {
              fout.textContent = res.d.error || "Onbekende fout";
              knop.disabled = false; knop.textContent = "Inloggen"; return;
            }
            // Het token gaat rechtstreeks in de opslag van het CMS. Sveltia leest
            // zijn eigen sleutel en, voor wie nog van Decap komt, ook de oude.
            var gebruiker = JSON.stringify({ backendName: "github", token: res.d.token });
            localStorage.setItem("sveltia-cms.user", gebruiker);
            localStorage.setItem("decap-cms-user", gebruiker);
            kwsLaadCms();
          })
          .catch(function (e) {
            fout.textContent = "Netwerkfout: " + e.message;
            knop.disabled = false; knop.textContent = "Inloggen";
          });
      }

      function kwsAanvraag() {
        var naam = document.getElementById("req-naam").value.trim();
        var email = document.getElementById("req-email").value.trim();
        var bericht = document.getElementById("req-bericht").value.trim();
        var knop = document.getElementById("req-btn");
        var fout = document.getElementById("req-error");
        var ok = document.getElementById("req-ok");
        if (!naam || !email) { fout.textContent = "Naam en e-mailadres zijn verplicht."; return; }
        knop.disabled = true; knop.textContent = "Versturen...";
        fout.textContent = ""; ok.style.display = "none";
        fetch("/api/request-access", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ naam: naam, email: email, bericht: bericht }),
        })
          .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
          .then(function (res) {
            if (!res.ok) {
              fout.textContent = res.d.error || "Onbekende fout";
              knop.disabled = false; knop.textContent = "Aanvraag versturen"; return;
            }
            ok.style.display = "block"; knop.textContent = "Verstuurd";
            ["req-naam", "req-email", "req-bericht"].forEach(function (id) { document.getElementById(id).value = ""; });
          })
          .catch(function (e) {
            fout.textContent = "Netwerkfout: " + e.message;
            knop.disabled = false; knop.textContent = "Aanvraag versturen";
          });
      }

      function kwsLaadCms() {
        document.getElementById("kws-overlay").style.display = "none";
        if (window.__kwsCmsGeladen) return;
        window.__kwsCmsGeladen = true;
        // Sveltia CMS: dezelfde config.yml en dezelfde inhoud als Decap, maar
        // een modern, snel beheer met een donker thema. Vaste versie, zodat een
        // nieuwe uitgave niet stilletjes iets anders doet.
        var s = document.createElement("script");
        s.src = "https://unpkg.com/@sveltia/cms@0.211.4/dist/sveltia-cms.js";
        document.body.appendChild(s);
      }
    </script>
  </body>
</html>
