name: Matchday-uitslag

# Kijkt na elke speeldag of de KBVB de uitslag en de doelpuntenmakers al
# gepubliceerd heeft, en mailt die dan ter goedkeuring. De KBVB zet die
# gegevens pas online nadat het digitale wedstrijdblad is ingediend; dat duurt
# soms enkele uren, soms tot de dag erna. Daarom kijken we ieder uur.
#
# Elke wedstrijd wordt maar één keer gemeld: de route houdt in Supabase bij
# welke uitslagen al de deur uit zijn.
#
# De planning staat bewust UIT. Zet het schedule-blok hieronder pas aan wanneer
# de secrets ingevuld zijn en je de testmail hebt goedgekeurd.

on:
  workflow_dispatch:
  # schedule:
  #   # Vrijdag tot en met maandag, ieder uur tussen 16:00 en 22:00 UTC
  #   # (18u tot 24u Belgische zomertijd).
  #   - cron: "0 16-22 * * 5,6,0,1"

jobs:
  uitslag:
    runs-on: ubuntu-latest
    steps:
      - name: Uitslagen nakijken
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://www.kwslinkhout.be' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET ontbreekt in de repository secrets."
            exit 1
          fi

          response=$(curl --silent --show-error --fail-with-body \
            --max-time 90 \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/social/uitslag-preview")

          echo "$response"

          # Niets nieuws is de normale uitkomst: de meeste runs vinden geen
          # verse uitslag, en dat is geen fout.
          echo "$response" | grep -q '"error"' && {
            echo "De route gaf een fout terug."
            exit 1
          }
          exit 0
